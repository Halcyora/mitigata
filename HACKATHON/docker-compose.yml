version: "3.9"

services:
  target-flask:
    build:
      context: ./targets/vulnerable_flask
      dockerfile: Dockerfile
    environment:
      APP_PORT: "5050"
    networks:
      - internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  target-juice-shop:
    image: bkimminich/juice-shop:v20.3.0@sha256:cea5a4af4aacee498c491491af0408934ec81d004035c0a02ef3e54395e3bf27
    networks:
      - internal
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 45s
    restart: unless-stopped

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: mitigata-engine
    ports:
      - "8000:8000"
    networks:
      - internal
      - public
    environment:
      TARGETS_ROOT: /targets
      TARGET_PROFILE: ${TARGET_PROFILE:-flask_demo}
    volumes:
      - ./targets:/targets:ro
      - ./configs:/app/configs:ro
      - ./data:/app/data
    env_file:
      - .env
    depends_on:
      target-flask:
        condition: service_healthy
      target-juice-shop:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mitigata-frontend
    ports:
      - "3000:3000"
    networks:
      - public
    depends_on:
      - engine
    restart: unless-stopped

networks:
  internal:
    internal: true
  public:
